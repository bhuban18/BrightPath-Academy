[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Route /api/notify-admin to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single Page Application (SPA) fallback to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
